<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ЛАД — Асимметрическая игра</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Основная карточка */
        .game-container {
            max-width: 550px;
            width: 100%;
            margin: auto;
            background: rgba(22, 30, 45, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff, #b0b8d0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .sub {
            text-align: center;
            color: #7f8c9a;
            font-size: 0.8rem;
            margin-bottom: 28px;
            border-bottom: 1px dashed #2a3348;
            display: inline-block;
            width: auto;
            padding-bottom: 6px;
        }

        /* Группы слайдеров */
        .slider-group {
            background: #11161f;
            border-radius: 48px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.2);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            font-weight: 600;
            color: #eef2ff;
        }

        .label-letter {
            font-size: 1.5rem;
            font-weight: 800;
            background: #1f2a3e;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            margin-right: 12px;
            box-shadow: inset 0 1px 2px #00000030, 0 2px 5px #00000040;
        }

        .value-badge {
            background: #0b1018;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: #cbdcff;
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #2e3a4e;
            border-radius: 10px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            background: #ffc164;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px black;
            border: 2px solid #ffdf9c;
        }

        /* Кнопка */
        .action-btn {
            width: 100%;
            background: linear-gradient(95deg, #e63e5f, #c72a4a);
            border: none;
            padding: 16px 12px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.4rem;
            color: white;
            margin: 16px 0 10px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .action-btn:active {
            transform: scale(0.97);
            background: #b32b48;
        }

        /* Показатель W */
        .w-card {
            background: #0b111c;
            border-radius: 48px;
            text-align: center;
            padding: 12px 10px;
            margin: 20px 0 16px;
        }

        .w-value {
            font-size: 4.9rem;
            font-weight: 800;
            font-family: monospace;
            line-height: 1;
            transition: color 0.1s ease;
        }

        .w-label {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #7e89a3;
        }

        /* статистика */
        .stats-panel {
            background: #0d121f;
            border-radius: 32px;
            padding: 14px 20px;
            margin: 18px 0 12px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .reset-btn {
            background: #292e42;
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: #cfdef5;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
        }

        .jackpot-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffd966, #ffb347);
            pointer-events: none;
            z-index: 999;
            animation: flashFade 0.4s ease-out forwards;
        }

        @keyframes flashFade {
            0% { opacity: 0.9; }
            100% { opacity: 0; visibility: hidden; }
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #556;
        }
    </style>
</head>
<body>
<div class="game-container" id="app">
    <h1>⚡ АСИММЕТРИЧЕСКАЯ ДИНАМИКА</h1>
    <div style="text-align:center"><span class="sub">ЗАКОН ЛАД • ПРОТОТИП</span></div>

    <!-- R -->
    <div class="slider-group">
        <div class="label-row">
            <span><span class="label-letter">R</span> СОПРОТИВЛЕНИЕ</span>
            <span class="value-badge" id="rVal">50</span>
        </div>
        <input type="range" id="rSlider" min="0" max="100" value="50">
    </div>

    <!-- S -->
    <div class="slider-group">
        <div class="label-row">
            <span><span class="label-letter">S</span> СПОСОБНОСТЬ</span>
            <span class="value-badge" id="sVal">50</span>
        </div>
        <input type="range" id="sSlider" min="0" max="100" value="50">
    </div>

    <button class="action-btn" id="calcBtn">🌀 ВЫЧИСЛИТЬ W</button>

    <!-- W результат -->
    <div class="w-card">
        <div class="w-value" id="wDisplay">0</div>
        <div class="w-label">ПОЛЕЗНАЯ РАБОТА W</div>
    </div>

    <!-- Статистика -->
    <div class="stats-panel">
        <div class="stat-line"><span>🎮 Ходов</span><strong id="movesCount">0</strong></div>
        <div class="stat-line"><span>🏆 Накоплено W</span><strong id="totalW">0</strong></div>
        <div class="stat-line" id="jackpotLine"><span>⚡ Джекпот</span><strong id="jackpotLabel">—</strong></div>
        <div class="stat-line"><span>🧬 η (адаптация)</span><strong id="etaDisplay">0.50</strong></div>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ СБРОС ПАМЯТИ</button>
    <footer>испытай асимметрию | переменное подкрепление | вибрация при W>85</footer>
</div>

<script>
    // ---------- LAD ENGINE (с сохранением состояний) ----------
    class LADEngine {
        constructor() {
            this.eta = 0.5;         // эффективность (адаптируется)
            this.lastGrad = 0.5;     // прошлый градиент
            this.prefR = 50;         // скрытые предпочтения системы
            this.prefS = 50;
        }

        computeW(R, S) {
            // ∇Φ - разница между текущим выбором и скрытыми предпочтениями
            let gradientRaw = (Math.abs(this.prefR - R) + Math.abs(this.prefS - S)) / 100;
            // d/dt |∇Φ|
            let deltaGrad = gradientRaw - this.lastGrad;
            this.lastGrad = gradientRaw;

            // адаптация η: положительная обратная связь на рост градиента
            this.eta = this.eta + 0.012 * deltaGrad;
            this.eta = Math.min(1.2, Math.max(0.2, this.eta));

            // базовая формула: W = η * (d∇Φ / (1+R_norm)) * S_norm
            let R_norm = R / 100;
            let S_norm = S / 100;
            let rawW = this.eta * (deltaGrad / (1 + R_norm)) * S_norm;
            let w = Math.min(1.0, Math.max(0.0, rawW));

            // 10% джекпот (имитация переменного подкрепления)
            let isJackpot = false;
            if (Math.random() < 0.1) {
                w = Math.min(1.0, w * 1.7);
                isJackpot = true;
            }

            // адаптация скрытых предпочтений: если W высокий, система подстраивается под игрока
            if (w > 0.65) {
                this.prefR = this.prefR * 0.92 + R * 0.08;
                this.prefS = this.prefS * 0.92 + S * 0.08;
                // ограничиваем в пределах 0..100
                this.prefR = Math.min(100, Math.max(0, this.prefR));
                this.prefS = Math.min(100, Math.max(0, this.prefS));
            }

            return { w, isJackpot, eta: this.eta };
        }

        reset() {
            this.eta = 0.5;
            this.lastGrad = 0.5;
            this.prefR = 50;
            this.prefS = 50;
        }
    }

    // ---------- Игровое состояние ----------
    let engine = new LADEngine();
    let moves = 0;
    let totalW = 0;
    let currentW = 0;
    let lastJackpotFlag = false;

    // DOM элементы
    const rSlider = document.getElementById('rSlider');
    const sSlider = document.getElementById('sSlider');
    const rVal = document.getElementById('rVal');
    const sVal = document.getElementById('sVal');
    const calcBtn = document.getElementById('calcBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wDisplay = document.getElementById('wDisplay');
    const movesSpan = document.getElementById('movesCount');
    const totalWSpan = document.getElementById('totalW');
    const jackpotLineSpan = document.getElementById('jackpotLabel');
    const etaSpan = document.getElementById('etaDisplay');

    // Вспомогательные функции
    function updateUI() {
        rVal.innerText = rSlider.value;
        sVal.innerText = sSlider.value;
        movesSpan.innerText = moves;
        totalWSpan.innerText = Math.floor(totalW * 100);
        // Джекпот
        if (lastJackpotFlag) {
            jackpotLineSpan.innerText = 'ДА! 🎰';
            jackpotLineSpan.style.color = '#ffd966';
        } else {
            jackpotLineSpan.innerText = '—';
            jackpotLineSpan.style.color = '#7e89a3';
        }
        // Цвет W
        let percent = currentW * 100;
        wDisplay.innerText = Math.floor(percent);
        if (percent < 33) wDisplay.style.color = '#ff6b6b';
        else if (percent < 66) wDisplay.style.color = '#ffb347';
        else wDisplay.style.color = '#7eff8f';
    }

    // вибрация (только для APK, в браузере работает если разрешено)
    function vibrateDevice(durationMs) {
        if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(durationMs);
        } else if (window.navigator && window.navigator.vibrate === undefined && window.navigator.vibrate === undefined) {
            // Android WebView часто поддерживает, но не всегда, игнорируем тихо
        }
    }

    // Визуальный джекпот-вспышка
    function showJackpotFlash() {
        const flashDiv = document.createElement('div');
        flashDiv.className = 'jackpot-flash';
        document.body.appendChild(flashDiv);
        setTimeout(() => {
            if (flashDiv && flashDiv.remove) flashDiv.remove();
        }, 450);
    }

    // анимация / вибрация на сильное W
    function handleHighW(wVal) {
        if (wVal > 0.85) {
            vibrateDevice(100);
            // Доп. эффект: кратковременная подсветка на кнопке
            calcBtn.style.transform = 'scale(0.98)';
            setTimeout(() => { calcBtn.style.transform = ''; }, 150);
        }
    }

    // Основное действие
    function computeW() {
        const R = parseFloat(rSlider.value);
        const S = parseFloat(sSlider.value);
        const result = engine.computeW(R, S);
        currentW = result.w;
        totalW += result.w;
        moves++;
        lastJackpotFlag = result.isJackpot;

        if (result.isJackpot) {
            showJackpotFlash();
        }

        handleHighW(currentW);
        updateUI();

        // отображаем η с округлением
        etaSpan.innerText = result.eta.toFixed(3);
        // Сохраняем в localStorage для сохранения состояния после перезагрузки
        saveGameState();
    }

    function resetGame() {
        engine.reset();
        moves = 0;
        totalW = 0;
        currentW = 0;
        lastJackpotFlag = false;
        // не сбрасываем положение ползунков, они остаются по желанию пользователя
        updateUI();
        etaSpan.innerText = engine.eta.toFixed(3);
        saveGameState();
        // небольшая вибрация при сбросе
        vibrateDevice(30);
    }

    // Сохранение состояния (ползунки, ходы, общий W)
    function saveGameState() {
        localStorage.setItem('lad_r', rSlider.value);
        localStorage.setItem('lad_s', sSlider.value);
        localStorage.setItem('lad_moves', moves);
        localStorage.setItem('lad_totalW', totalW);
        localStorage.setItem('lad_eta', engine.eta);
        localStorage.setItem('lad_prefR', engine.prefR);
        localStorage.setItem('lad_prefS', engine.prefS);
        localStorage.setItem('lad_lastGrad', engine.lastGrad);
    }

    function loadGameState() {
        const savedR = localStorage.getItem('lad_r');
        const savedS = localStorage.getItem('lad_s');
        if (savedR !== null) rSlider.value = savedR;
        if (savedS !== null) sSlider.value = savedS;
        const savedMoves = localStorage.getItem('lad_moves');
        if (savedMoves !== null) moves = parseInt(savedMoves);
        const savedTotalW = localStorage.getItem('lad_totalW');
        if (savedTotalW !== null) totalW = parseFloat(savedTotalW);
        if (localStorage.getItem('lad_eta')) engine.eta = parseFloat(localStorage.getItem('lad_eta'));
        if (localStorage.getItem('lad_prefR')) engine.prefR = parseFloat(localStorage.getItem('lad_prefR'));
        if (localStorage.getItem('lad_prefS')) engine.prefS = parseFloat(localStorage.getItem('lad_prefS'));
        if (localStorage.getItem('lad_lastGrad')) engine.lastGrad = parseFloat(localStorage.getItem('lad_lastGrad'));
        // синхронизируем отображение
        rVal.innerText = rSlider.value;
        sVal.innerText = sSlider.value;
        updateUI();
        etaSpan.innerText = engine.eta.toFixed(3);
    }

    // Обновление цифр при движении слайдеров
    rSlider.addEventListener('input', () => {
        rVal.innerText = rSlider.value;
        saveGameState();
    });
    sSlider.addEventListener('input', () => {
        sVal.innerText = sSlider.value;
        saveGameState();
    });
    calcBtn.addEventListener('click', computeW);
    resetBtn.addEventListener('click', resetGame);

    // инициализация
    loadGameState();
    updateUI();
    etaSpan.innerText = engine.eta.toFixed(3);
</script>
</body>
</html>
